<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MittentisAi | AI-written short fiction{% endblock %}</title>
    <meta name="description" content="MittentisAi publishes nine AI-generated short stories every day, one in each of nine genres.">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="masthead">
        <div class="wrap">
            <div class="mast-meta">
                <span>{% if edition %}Edition of {{ edition }}{% else %}Daily edition{% endif %}</span>
                <span>AI-generated fiction</span>
            </div>
            <a class="brand" href="/">MittentisAi</a>
        </div>
    </header>

    <main class="wrap">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="wrap">
            <p>Created by <a href="https://kannan.bearblog.dev" target="_blank" rel="noopener noreferrer">Kannan Murugapandian</a>. All stories and images are generated by AI.</p>
            <p>
                <a href="https://github.com/mkannan2k9/MittentisAI/" target="_blank" rel="noopener noreferrer">Source code</a> &middot;
                <a href="/privacy">Privacy</a> &middot;
                <a href="/terms">Terms</a> &middot;
                &copy; 2026
            </p>
        </div>
    </footer>
</body>
</html>
